name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Kiểm tra lõi mô phỏng
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/test.js

  deploy:
    name: Build & deploy
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Cache-busting: gắn ?v=<mã commit> vào mọi tệp CSS/JS để trình duyệt
      # luôn tải bản mới sau mỗi lần deploy, không dùng lại bản cũ đã lưu.
      - name: Build (cache-busting)
        run: |
          VERSION="${GITHUB_SHA::8}"
          mkdir -p _site
          cp -r index.html css js _site/
          sed -i -E "s#(href|src)=\"((css|js)/[^\"?]+)\"#\1=\"\2?v=${VERSION}\"#g" _site/index.html
          sed -i "s#</head>#<meta name=\"machsim-version\" content=\"${VERSION}\">\n</head>#" _site/index.html
          touch _site/.nojekyll
          grep -nE "\?v=|machsim-version" _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
