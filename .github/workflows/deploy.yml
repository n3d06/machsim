name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Kiểm tra lõi mô phỏng
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/test.js

  deploy:
    name: Build & deploy
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Cache theo phiên bản: CSS/JS mang ?v=<mã commit> nên được lưu lâu trong cache
      # (Service Worker lấy từ cache trước, chạy được offline); khi có commit mới,
      # đường dẫn đổi nên trình duyệt tự lấy bản mới và xoá bộ cache cũ.
      - name: Build (cache theo phiên bản)
        run: |
          VERSION="${GITHUB_SHA::8}"
          mkdir -p _site
          cp -r index.html sw.js manifest.webmanifest icon.svg css js _site/
          sed -i "s/__VERSION__/${VERSION}/" _site/sw.js
          sed -i -E "s#(href|src)=\"((css|js)/[^\"?]+)\"#\1=\"\2?v=${VERSION}\"#g" _site/index.html
          sed -i "s#</head>#<meta name=\"machsim-version\" content=\"${VERSION}\">\n</head>#" _site/index.html
          touch _site/.nojekyll
          grep -nE "\?v=|machsim-version" _site/index.html
          grep -n "const VERSION" _site/sw.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
