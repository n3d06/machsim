name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Kiểm tra lõi mô phỏng
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/test.js

  deploy:
    name: Build & deploy
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Vite băm tên file trong dist/assets nên cache được vô thời hạn; sw.js chỉ cần mã phiên bản
      # để mỗi bản deploy có một bộ cache riêng (bản cũ bị xoá khi bản mới kích hoạt).
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: |
          VERSION="${GITHUB_SHA::8}"
          npm run build
          sed -i "s/__VERSION__/${VERSION}/" dist/sw.js
          sed -i "s#</head>#<meta name=\"machsim-version\" content=\"${VERSION}\"></head>#" dist/index.html
          touch dist/.nojekyll
          grep -n "machsim-version" dist/index.html
          grep -n "const VERSION" dist/sw.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
